<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ритуал выполнен!</title>
  <link rel="stylesheet" href="/styles/common.css">
  <link rel="stylesheet" href="/styles/ritual-done.css">
</head>
<body>
  <div class="screen ritual-done">
    <main class="ritual-done__body">
      <div class="ritual-done__icon">
        <div class="ritual-done__icon-inner"></div>
      </div>

      <h1 class="ritual-done__title">🎉 Ритуал выполнен!</h1>
      <p class="ritual-done__subtitle">Твой разум стал немного спокойнее сегодня.</p>

      <div class="ritual-done__card">
        <h2 class="ritual-done__card-title">Ты сделал:</h2>

        <ul class="ritual-done__list">
          <li class="ritual-done__item">
            <span class="ritual-done__check"></span>
            Дневник (5 мин)
          </li>
          <li class="ritual-done__item">
            <span class="ritual-done__check"></span>
            Дыхание 4-7-8 (5 мин)
          </li>
          <li class="ritual-done__item">
            <span class="ritual-done__check"></span>
            Отдых без телефона
          </li>
        </ul>

        <div class="ritual-done__total">
          <span class="ritual-done__total-label">Общее время:</span>
          <span class="ritual-done__total-value">10 минут</span>
        </div>
      </div>

      <div class="ritual-done__actions">
        <a class="ritual-done__btn ritual-done__btn--primary" href="index.html">На главную</a>
        <a class="ritual-done__btn ritual-done__btn--secondary" href="history.html">Посмотреть историю</a>
      </div>

      <span class="ritual-done__streak">🔥 3 дня подряд!</span>
    </main>

    <nav class="bottom-nav">
      <a href="index.html" class="bottom-nav__item bottom-nav__item--active">
        <span class="bottom-nav__icon"></span>
        Дневник
      </a>
      <a href="history.html" class="bottom-nav__item">
        <span class="bottom-nav__icon"></span>
        История
      </a>
      <a href="insights.html" class="bottom-nav__item">
        <span class="bottom-nav__icon"></span>
        Инсайты
      </a>
    </nav>
  </div>
</body>
</html>
